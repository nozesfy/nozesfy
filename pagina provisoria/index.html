<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>nozesfy · Hub</title>
  <link rel="icon" type="image/webp" href="favicon.webp">
  <link rel="shortcut icon" type="image/webp" href="favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      font-family: 'Inter', system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Container central ── */
    .center {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.25rem;
      padding: 1.5rem;
      max-height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .center::-webkit-scrollbar { display: none; }

    /* ── Logo ── */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .main-logo {
      max-width: 300px;
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }

    /* ── Grupo de botões ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    /* ── Botão primário (preto) ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #000000;
      color: #ffffff;
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      padding: 0.9rem 1.75rem;
      border-radius: 6px;
      border: 1.5px solid transparent;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:hover {
      background: #1a1a1a;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .btn-primary:active {
      transform: scale(0.98);
      transition-duration: 0.06s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .btn-primary:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    /* ── Botão outline ── */
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      padding: 0.9rem 1.75rem;
      border-radius: 6px;
      border: 1.5px solid #e2e8f0;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-outline:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-outline:active {
      transform: scale(0.98);
      transition-duration: 0.06s;
    }

    .btn-outline:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    /* ── Ícone de seta (animação sutil) ── */
    .arrow {
      display: inline-block;
      transition: transform 0.18s ease;
      font-style: normal;
      line-height: 1;
    }

    .btn-primary:hover .arrow,
    .btn-outline:hover .arrow {
      transform: translateX(3px);
    }

    /* ── Rodapé discreto ── */
    .footer-note {
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: -0.01em;
      text-align: center;
      user-select: none;
    }

    /* ── Animação de entrada ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrapper   { animation: fadeUp 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
    .btn-group      { animation: fadeUp 0.45s 0.12s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
    .footer-note    { animation: fadeUp 0.45s 0.22s cubic-bezier(0.2, 0.8, 0.3, 1) both; }

    /* ── Responsividade ── */
    @media (max-width: 480px) {
      .main-logo { max-width: 240px; }
      .btn-primary, .btn-outline {
        font-size: 1rem;
        padding: 0.8rem 1.5rem;
      }
      .center { gap: 2rem; }
    }

    @media (max-width: 360px) {
      .main-logo { max-width: 200px; }
    }

    a, button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div class="center">

    <!-- Logo -->
    <div class="logo-wrapper">
      <img
        class="main-logo"
        src="logo.webp"
        alt="nozesfy logotipo"
        loading="eager"
        id="main-logo"
      >
    </div>

    <!-- Botões -->
    <div class="btn-group">
      <!-- Botão de documentação -->
      <a
        id="btn-docs"
        class="btn-primary"
        href="https://github.com/nozesfy"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Documentação</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <!-- Rodapé -->
    <p class="footer-note">nozesfy · hub</p>

  </div>

  <script>
    (function () {
      // Fallback silencioso caso logo.webp não carregue
      var logo = document.getElementById('main-logo');
      if (logo) {
        logo.addEventListener('error', function () {
          logo.style.opacity = '0';
          if (window.console && console.debug) {
            console.debug('logo.webp não carregou. Verifique o caminho do arquivo.');
          }
        });
      }

      // Bloqueia scroll acidental (teclado + roda + touch)
      function preventScroll(e) {
        var keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' ', 'Home', 'End'];
        if (e.type === 'keydown' && keys.includes(e.key)) { e.preventDefault(); return; }
        if (e.type === 'wheel') { e.preventDefault(); }
      }
      window.addEventListener('wheel', preventScroll, { passive: false });
      window.addEventListener('keydown', preventScroll);
      window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
